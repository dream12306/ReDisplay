plugins {
    id "com.android.application"
}

android {
    namespace "com.redisplay.client"
    compileSdk 35

    defaultConfig {
        applicationId "com.redisplay.client"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.8.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
